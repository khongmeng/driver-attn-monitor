# PC training / feature-extraction env (Windows or Linux).
#
# Torch is installed from the PyTorch wheel index (the conda `pytorch-cuda`
# metapackage stopped at 12.4, so the old `pytorch-cuda=12.8` pin did not solve).
# GPU build (RTX 4070 Ti Super) uses the cu124 index below; for a CPU-only box
# swap that URL to https://download.pytorch.org/whl/cpu
name: dms-train
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pip:
    - --extra-index-url https://download.pytorch.org/whl/cu124
    - torch
    - torchvision
    - numpy
    - pandas               # feature tables (DMD extraction)
    - pyyaml
    - tqdm
    - matplotlib
    - scikit-learn
    - opencv-python        # PC only -- NOT for Jetson
    - onnx                 # model export
    - onnxruntime-gpu==1.22.0  # CUDA 12 (matches torch cu124); 1.27 needs CUDA 13. CPU-only: use `onnxruntime`
    - insightface          # SCRFD-500M face detector (cascade stage 1)
    - sixdrepnet           # 6DRepNet head pose (cascade stage 2)
    - openvino             # gaze-estimation-adas-0002 IR (cascade stage 5, eye gaze)
    - ultralytics          # YOLOv8 / YOLO11 (later: Stage-4 classifier)
    - albumentations       # augmentation
    - jupyter
    - ipykernel
    - tensorboard

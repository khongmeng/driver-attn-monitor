camera:
  sensor_id: 0
  width: 1280
  height: 720
  framerate: 30
  flip_method: 0

face_mesh:
  max_faces: 1
  refine_landmarks: true

ear:
  threshold: 0.21        # eye aspect ratio below this = closed
  consecutive_frames: 3  # frames below threshold to count a blink

head_pose:
  yaw_threshold: 30      # degrees left/right before "distracted"
  pitch_threshold: 20    # degrees up/down before "distracted"

gaze:
  arrow_gain: 220        # px per unit of normalized iris offset; arrow length scales with gaze (not fixed)
  deadzone: 0.04         # normalized offset below this = looking straight ahead, no arrow drawn
  smoothing: 0.35        # EMA factor per frame (0 = frozen, 1 = no smoothing / raw)

state:
  perclos_window_sec: 60   # rolling window for PERCLOS calculation
  drowsy_perclos: 0.20     # PERCLOS >= 20% triggers drowsy alert

object_detector:
  model_path: models/efficientdet_lite0.tflite  # EfficientDet-Lite, 80 COCO classes
  score_threshold: 0.35
  max_results: 5

display:
  window_title: "DMS - Driver Monitoring System"
  show_fps: true

# --- PC-side feature-extraction cascade (train/extract_features.py) -----------
# Used only by the offline DMD pipeline on the PC, not the Jetson runtime above.
cascade:
  use_gpu: true                 # onnxruntime CUDA EP / torch CUDA if available

  face:                         # (1) SCRFD via InsightFace
    model_pack: buffalo_sc      # SCRFD-500M detector (+5pt keypoints)
    det_size: 640
    det_thresh: 0.5

  head_pose:                    # (2) 6DRepNet
    enabled: true
    crop_margin: 0.25           # expand SCRFD box this fraction before pose

  eye_state:                    # (3) open-closed-eye-0001 (ONNX)
    enabled: true
    onnx_path: models/eye_state/open_closed_eye.onnx
    input_size: 32
    open_index: 1               # output index of the "open" class
    bgr: false                  # model trained on RGB (MO --reverse_input_channels)
    scale: 0.00392156862745098  # 1/255
    mean: 127.5                 # (x - 127.5) / 255  -> normalized input
    eye_box_frac: 0.30          # eye crop half-size as fraction of inter-ocular dist

  gaze:                         # (5) gaze-estimation-adas-0002 (OpenVINO IR)
    enabled: true               # finer "looking away" signal for DISTRACTED
    model_xml: models/gaze/gaze-estimation-adas-0002.xml
    eye_box_frac: 0.25          # eye crop half-size as fraction of inter-ocular dist

  mouth:                        # mouth landmarks -> Mouth Aspect Ratio -> yawn
    enabled: true               # InsightFace 2d106det (106-pt landmarks); no
                                # pretrained mouth-state ONNX model exists (§8.7)
    onnx_path: models/landmark/2d106det.onnx
    open_thresh: 0.5            # MAR above this = mouth open. §8.7 tested tuning this to
                                # 0.64 (best frame-level accuracy against gt_yawn, 91.0%
                                # vs 89.1%) but found it tanks yawn-EVENT recall (44 vs
                                # GT 76 sustained yawns, was 87 vs GT 76 at 0.5) — same
                                # mistake shape as blink_min_frames=2. Reverted to 0.5;
                                # frame-level "best threshold" isn't the same as best for
                                # the event-level signal the classifier actually needs.

  temporal:                     # PERCLOS / blink / yawn (driven by the eye + mouth models)
    eye_closed_thresh: 0.5      # eye_open_prob below this = closed
    blink_min_frames: 1         # consecutive closed frames to count a blink. §6.1 found
                                # -85%/+41% per-session over/under-counting and hypothesized
                                # a single noisy dip was the cause; §8.7 tested
                                # blink_min_frames=2 and found it makes the aggregate WORSE
                                # (0.61x vs 1.01x, systematic undercount — real blinks are
                                # often only 1-2 samples wide at this stride-2 rate).
                                # Reverted to 1; the per-session variance is a real
                                # unresolved limitation, not fixed by this debounce.
    perclos_window_sec: 60
    yawn_min_duration_sec: 1.0  # continuous mouth-open duration to count as a yawn

# --- PC-side RAW-PIXEL end-to-end pipeline (train/rawpixel/) ------------------
# A separate, self-contained experiment line (docs/METHODOLOGY.md §14): face
# crop -> frozen pretrained 2D-CNN embedding -> GRU, no hand-engineered
# features. Kept isolated from `cascade:` above on purpose (own code, own
# output/model dirs) so the two approaches can be compared without either
# depending on the other. Only the face detector and DMD dataset/annotation
# readers are shared (utilities, not features/results).
rawpixel:
  use_gpu: true
  stride: 2                     # match cascade's extraction stride for a fair comparison

  face:                         # SCRFD, crop coordinates only — no cascade feature reuse
    model_pack: buffalo_sc
    det_size: 640
    det_thresh: 0.5

  crop:
    size: 112                   # face-recognition-standard crop resolution
    margin: 0.25                # expand SCRFD box this fraction before crop

  backbone:
    name: resnet18              # torchvision, ImageNet-pretrained, frozen (not fine-tuned —
                                # see docs/METHODOLOGY.md §14 for why)
    embed_dim: 512

  gru:
    proj_dim: 128                # trainable linear bottleneck before the GRU (the only
                                 # part of the "vision" side that trains)
    hidden: 64
    layers: 2
